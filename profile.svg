                <div class="project-title">
                  <a href="https://github.com/jamiem0/uaw">Universal Automation Wiki</a> <span class="main-project-badge">— Main Project</span>
                </div>
                <p>An open-source platform that maps real-world processes into interactive time-based simulations, showing who does what, when, and with which resources. Each simulation models objects over realistic timeframes, creating dynamic digital twins of everything from bakeries to manufacturing facilities.</p>
                <br/>
                <p>Users can explore bottlenecks, test optimisation scenarios, and visualise how automation changes would impact real operations. The playground features a real-time validation engine that automatically identifies issues like resource conflicts, timing violations, and dependency errors.</p>
                <br/>
                <p>Users can build new validation metrics using computational functions, ensuring simulations meet industry-specific quality standards with transparent, objective scoring in addition to subjective assessment via the planned LLM extension of the validation system.</p>
              </div>
